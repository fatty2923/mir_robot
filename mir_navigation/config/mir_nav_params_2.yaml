      # use_astar: true              # <-- A* instead of Dijkstra
      # allow_unknown: true          # allow unknown, more aggressive

      # plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      # tolerance: 0.25             # same goal tolerance as Smac/A*
      # allow_unknown: true         # let it consider unknown space
      # max_iterations: 80000       # high enough, but lower than Smac for clearer timing differences
