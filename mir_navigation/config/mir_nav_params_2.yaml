      # how_many_poses_look_ahead: 1    # aggressive shortcutting
      # weight_heuristic: 1.0           # pure Euclidean heuristic
      # weight_traversal_cost: 1.5      # still consider costmap values
      # minimum_distance_from_obstacle: 0.15  # keep a bit of margin from obstacles

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-4                      # CHANGED # was: 1.0e-10
      max_its: 200
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2                # CHANGED # was: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0                 # CHANGED # was: 0.5
    min_rotational_vel: 0.3                 # CHANGED # was: 0.4
    rotational_acc_lim: 1.5                 # CHANGED # was: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 400

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0   # 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Mirror controller limits
    max_velocity: [1.00, 0.0, 1.20]
    min_velocity: [-1.00, 0.0, -1.20]
    max_accel:    [1.50, 0.0, 2.00]
    max_decel:    [-1.60, 0.0, -2.50]
    odom_topic: "odom"
    odom_duration: 0.15                      # CHANGED # was: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.4                   # CHANGED # was: 1.0